}

async function inyectar(){
  const btn = document.getElementById('btn-1');
  if(btn) btn.disabled = true;
  document.getElementById('pb-1').style.width = '10%';
  log('▶ Iniciando inyección...');
  try{
    log('Buscando y limpiando demos anteriores...');
    const prevSnap = await db.ref('negocios').orderByChild('info/email').equalTo('demo@buensabor.com').once('value');
    if(prevSnap.exists()){
      const ops = [];
      prevSnap.forEach(c => { ops.push(db.ref(`negocios/${c.key}`).remove()); });
      await Promise.all(ops);
      log(`Se eliminaron ${ops.length} demos anteriores.`);
    }

    log('Generando estructura de prueba...');
    const D=getDatosRestaurante();
    const ID=D.ID;

    await db.ref(`negocios/${ID}/info`).set(D.info);
    await db.ref(`negocios/${ID}/modulos`).set(D.modulos);
    document.getElementById('pb-1').style.width = '30%';
    log('✅ Info y Módulos inyectados.');

    await db.ref(`negocios/${ID}/empleados`).set(D.empleados);
    document.getElementById('pb-1').style.width = '45%';
    log('✅ Empleados inyectados (Admin DUI: 00000000-0)');

    const pKeys=Object.keys(D.productos);
    for(const cat of pKeys){
      for(const p of D.productos[cat]){
        p.categoria=cat;
        await db.ref(`negocios/${ID}/productos/${cat}/${pushKey()}`).set(p);
      }
    }
    document.getElementById('pb-1').style.width = '65%';
    log('✅ Productos Inyectados');

    if(D.clientes){
      await db.ref(`negocios/${ID}/clientes`).set(D.clientes);
      log('✅ Clientes Inyectados');
    }

    await db.ref(`negocios/${ID}/mesas`).set(D.mesas);
    await db.ref(`negocios/${ID}/cocina_orders`).set(D.cocina);
    await db.ref(`negocios/${ID}/ventas`).set(D.ventas);
    await db.ref(`negocios/${ID}/pedidos`).set(D.ventas);
    await db.ref(`negocios/${ID}/insumos`).set(D.insumos);
    await db.ref(`negocios/${ID}/repartidores`).set(D.repartidores);
    
    document.getElementById('pb-1').style.width = '100%';
    btn.textContent = '✅ INYECCIÓN COMPLETADA';
    btn.style.background = '#059669';

    log('🎉 Restaurante inyectado correctamente. negocioID: '+ID);
    log('🔑 Demo Login: | Correo: demo@buensabor.com | Clave: Demo2026* | DUI: 00000000-0');
  }catch(e){
    log('❌ ERROR: '+e.message, 'err');
    btn.disabled=false;
    btn.textContent='❌ Error. Reintentar';
  }
}
