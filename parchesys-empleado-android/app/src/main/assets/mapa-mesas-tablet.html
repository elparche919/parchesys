<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PARCHE SYS · Mapa Interactivo</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="firebase-app-compat.js"></script>
  <script src="firebase-database-compat.js"></script>
  <style>
    :root {
      --bg: #09090b;
      --bg-grid: #09090b;
      --sur: rgba(18, 18, 22, 0.7);
      --sur-solid: #121216;
      --ink: #f4f4f5;
      --ink-muted: #a1a1aa;
      --accent: #10b981;
      --accent-hover: #34d399;
      --accent-glow: rgba(16, 185, 129, 0.35);
      --bd: rgba(255, 255, 255, 0.08);
      --bd-light: rgba(255, 255, 255, 0.04);
      --font: 'Inter', sans-serif;
      --fh: 'Outfit', sans-serif;
      --shadow: 0 12px 40px rgba(0,0,0,0.5);
      
      --libre-grad: linear-gradient(135deg, #059669, #10b981);
      --libre-glow: 0 0 18px rgba(16, 185, 129, 0.45);
      
      --ocupada-grad: linear-gradient(135deg, #d97706, #f59e0b);
      --ocupada-glow: 0 0 18px rgba(245, 158, 11, 0.45);
      
      --cuenta-grad: linear-gradient(135deg, #dc2626, #ef4444);
      --cuenta-glow: 0 0 24px rgba(239, 68, 68, 0.6);
      
      --inactiva-bg: #1f1f23;
      --inactiva-border: #3f3f46;
      --inactiva-text: #71717a;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body { 
      font-family: var(--font); 
      background: var(--bg); 
      color: var(--ink); 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden;
    }

    /* ── HEADER ── */
    .tb { 
      background: var(--sur); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px 28px; 
      border-bottom: 1px solid var(--bd); 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .tb-l { display: flex; align-items: center; gap: 14px; }
    .tb-logo { 
      width: 40px; 
      height: 40px; 
      background: var(--accent); 
      border-radius: 12px; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
    }
    .tb-logo i { color: white; font-size: 18px; }
    .tb-title-container { display: flex; flex-direction: column; }
    .tb-title { font-family: var(--fh); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; color: var(--ink); line-height: 1.2; }
    .tb-subtitle { font-size: 11px; color: var(--ink-muted); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
    
    .tb-actions { display: flex; align-items: center; gap: 10px; }
    .btn { 
      padding: 10px 18px; 
      border-radius: 12px; 
      font-weight: 700; 
      font-size: 13px; 
      font-family: var(--font);
      cursor: pointer; 
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid var(--bd); 
      background: rgba(255, 255, 255, 0.03);
      display: flex; 
      align-items: center; 
      gap: 8px; 
      color: var(--ink-muted); 
      text-decoration: none;
    }
    .btn:hover { 
      border-color: var(--accent); 
      color: var(--ink); 
      background: rgba(16, 185, 129, 0.08);
      transform: translateY(-1px);
    }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .btn.primary:hover { background: #ffffff; color: #000000; box-shadow: 0 0 15px rgba(255,255,255,0.15); }
    .btn.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
    .btn.active:hover { background: var(--accent-hover); }

    /* ── TOOLBAR ── */
    .toolbar {
      padding: 10px 28px; 
      background: rgba(18, 18, 22, 0.5); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--bd); 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      z-index: 90;
    }
    .legend { display: flex; align-items: center; gap: 16px; font-size: 11px; font-weight: 700; color: var(--ink-muted); }
    .l-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    /* ── CANVAS AREA ── */
    .canvas-bg { 
      flex: 1; 
      position: relative; 
      overflow: hidden; 
      touch-action: none;
      background-color: var(--bg-grid);
      background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1.5px, transparent 1.5px);
      background-size: 30px 30px;
      display: block;
    }
    .main-canvas {
      width: 2400px; height: 1600px; background: transparent; 
      position: relative; overflow: visible;
      transform-origin: top left;
      transition: transform 0.1s linear;
    }

    /* ── FLOATING ROOMS SELECTOR ── */
    .rooms-bar { 
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      display: flex; 
      gap: 6px; 
      padding: 6px 12px; 
      background: rgba(18, 18, 22, 0.75); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--bd); 
      border-radius: 99px;
      align-items: center; 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      max-width: 90%;
      overflow-x: auto;
      scrollbar-width: none;
      transition: all 0.3s ease;
    }
    .rooms-bar::-webkit-scrollbar { display: none; }
    
    .room-tab {
      padding: 12px 24px; 
      border-radius: 99px; 
      font-weight: 700; 
      font-size: 15px; 
      cursor: pointer;
      background: transparent; 
      color: var(--ink-muted); 
      border: 1px solid transparent; 
      transition: all 0.2s ease; 
      white-space: nowrap;
    }
    .room-tab:hover { 
      color: var(--ink); 
      background: rgba(255, 255, 255, 0.05); 
    }
    .room-tab.active { 
      background: rgba(16, 185, 129, 0.15); 
      color: var(--accent-hover); 
      border-color: rgba(16, 185, 129, 0.3);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.1);
    }
    .btn-add-room { 
      padding: 12px 20px; 
      border-radius: 99px; 
      font-size: 14px; 
      font-weight: 800; 
      background: transparent; 
      border: 1px dashed var(--accent); 
      color: var(--accent); 
      cursor: pointer; 
      transition: all 0.2s ease;
      white-space: nowrap;
      margin-left: 6px;
    }
    .btn-add-room:hover { 
      background: rgba(16, 185, 129, 0.15); 
      border-style: solid;
      color: var(--accent-hover);
    }

    /* ── TABLES ── */
    .mesa {
      position: absolute; 
      width: 100px; 
      height: 100px; 
      touch-action: none;
      background: var(--sur-solid); 
      border: 2px solid rgba(255, 255, 255, 0.1); 
      border-radius: 20px;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      cursor: pointer; 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
      user-select: none;
      box-shadow: var(--shadow);
    }
    .mesa:hover { 
      transform: scale(1.05); 
      z-index: 10; 
      border-color: rgba(255, 255, 255, 0.25); 
    }
    .mesa.selected { 
      border-color: var(--accent); 
      box-shadow: 0 0 0 4px var(--accent-glow), var(--shadow); 
      z-index: 20; 
    }
    .mesa.dragging { 
      opacity: 0.85; 
      cursor: grabbing; 
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6); 
      transform: scale(1.08); 
      transition: none; 
    }
    
    .mesa-id { font-family: var(--fh); font-weight: 800; font-size: 28px; line-height: 1; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .mesa-cap { font-size: 13px; font-weight: 700; opacity: 0.7; margin-top: 5px; display: flex; align-items: center; gap: 4px; }

    .mesa.round { border-radius: 50%; }
    .mesa.horiz { width: 160px; height: 100px; }
    .mesa.vert { width: 100px; height: 160px; }
    .mesa.large { 
      width: 200px; 
      height: 200px; 
      border-radius: 28px;
      border-width: 3px;
    }
    .mesa.large .mesa-id { font-size: 42px; }
    .mesa.large .mesa-cap { font-size: 15px; margin-top: 8px; }

    /* Estilos de Estados con Degradados Premium y Brillos */
    .mesa.libre { 
      background: var(--libre-grad); 
      border-color: rgba(16, 185, 129, 0.4); 
      box-shadow: var(--libre-glow), var(--shadow); 
    }
    .mesa.libre .mesa-id, .mesa.libre .mesa-cap { color: #ffffff; }

    .mesa.ocupada { 
      background: var(--ocupada-grad); 
      border-color: rgba(245, 158, 11, 0.4); 
      box-shadow: var(--ocupada-glow), var(--shadow); 
    }
    .mesa.ocupada .mesa-id, .mesa.ocupada .mesa-cap { color: #ffffff; }

    .mesa.cuenta { 
      background: var(--cuenta-grad); 
      border-color: rgba(239, 68, 68, 0.4); 
      box-shadow: var(--cuenta-glow), var(--shadow); 
      animation: pulse-glow 1.5s infinite alternate; 
    }
    .mesa.cuenta .mesa-id, .mesa.cuenta .mesa-cap { color: #ffffff; }

    .mesa.desconectada, .mesa.inactiva { 
      background: var(--inactiva-bg); 
      border-color: var(--inactiva-border); 
      box-shadow: none; 
    }
    .mesa.desconectada .mesa-id, .mesa.desconectada .mesa-cap,
    .mesa.inactiva .mesa-id, .mesa.inactiva .mesa-cap { 
      color: var(--inactiva-text); 
      opacity: 0.6;
    }

    @keyframes pulse-glow { 
      0% { box-shadow: 0 0 12px rgba(239, 68, 68, 0.35), var(--shadow); } 
      100% { box-shadow: 0 0 28px rgba(239, 68, 68, 0.8), var(--shadow); transform: scale(1.02); } 
    }

    /* Icono indicador del modo editor en las mesas */
    .edit-indicator {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 22px;
      height: 22px;
      background: var(--accent);
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: white;
      border: 2px solid var(--bg);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    body.editor-active .edit-indicator { display: flex; }

    .edit-grid { 
      position: absolute; 
      inset: 0; 
      pointer-events: none; 
      background-size: 30px 30px;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
    }
    
    /* ── PANEL DERECHO DE EDICIÓN (GLASSMORPHIC) ── */
    .side-panel {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 2000;
      width: 340px; 
      background: rgba(18, 18, 22, 0.85); 
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-left: 1px solid var(--bd);
      display: flex; flex-direction: column; overflow: hidden;
      transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -15px 0 40px rgba(0,0,0,0.6);
    }
    .side-panel.open { transform: translateX(0); }
    .p-head { padding: 24px 28px; border-bottom: 1px solid var(--bd); }
    .p-head h3 { font-family: var(--fh); font-weight: 800; font-size: 20px; color: var(--ink); }
    .p-body { padding: 28px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; }
    
    .field-group { display: flex; flex-direction: column; gap: 8px; }
    .lbl { font-size: 11px; font-weight: 800; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .inp { 
      padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--bd); 
      background: rgba(255, 255, 255, 0.03);
      color: var(--ink);
      font-size: 14px; font-weight: 600; font-family: var(--font); outline: none;
      transition: all 0.2s ease;
    }
    .inp:focus { 
      border-color: var(--accent); 
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.15);
    }

    .shape-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .shape-btn { 
      padding: 14px; border-radius: 12px; border: 1.5px solid var(--bd); 
      background: rgba(255,255,255,0.02);
      color: var(--ink-muted);
      cursor: pointer; text-align: center;
      font-size: 20px; transition: all 0.2s ease;
    }
    .shape-btn:hover { 
      border-color: var(--accent); 
      background: rgba(16, 185, 129, 0.05); 
      color: var(--ink);
    }
    .shape-btn.active { 
      border-color: var(--accent); 
      background: var(--accent); 
      color: white; 
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .bottom-actions { 
      padding: 24px 28px; 
      border-top: 1px solid var(--bd); 
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; 
      background: rgba(0,0,0,0.2);
    }

    /* ── EMBED MODE: hide chrome when inside iframe ── */
    body.embed-mode .tb,
    body.embed-mode .toolbar { display: none !important; }
    body.embed-mode { background: #09090b; }
    body.embed-mode .canvas-bg {
      background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1.5px, transparent 1.5px);
      background-size: 30px 30px;
    }
    body.embed-mode .rooms-bar {
      top: 10px;
    }

    /* ── CREATOR PALETTE SIDEBAR ── */
    .creator-palette {
      position: absolute;
      top: 90px;
      left: 20px;
      z-index: 500;
      width: 90px;
      background: rgba(18, 18, 22, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--bd);
      border-radius: 20px;
      padding: 12px 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    body.editor-active .creator-palette {
      display: flex;
    }
    .cp-title {
      font-size: 8px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-align: center;
      border-bottom: 1px solid var(--bd);
      padding-bottom: 8px;
      width: 100%;
    }
    .cp-items {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }
    .cp-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 4px 0;
      border-radius: 8px;
    }
    .cp-item:hover {
      background: rgba(255, 255, 255, 0.05);
      transform: translateY(-2px);
    }
    .cp-item span {
      font-size: 9px;
      font-weight: 700;
      color: var(--ink-muted);
    }
    .cp-item:hover span {
      color: var(--ink);
    }
    .cp-preview {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.2s ease;
    }
    .cp-item:hover .cp-preview {
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.1);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.3);
    }
    .cp-preview.square { border-radius: 6px; }
    .cp-preview.round { border-radius: 50%; }
    .cp-preview.horiz { width: 42px; height: 26px; border-radius: 6px; }
    .cp-preview.vert { width: 26px; height: 42px; border-radius: 6px; }
    .cp-preview.large { width: 38px; height: 38px; border-radius: 8px; border-width: 2.5px; }

    /* ── QUICK ACTION FLOATING MENU ── */
    .quick-menu {
      position: absolute;
      z-index: 1000;
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(18, 18, 22, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid var(--accent);
      border-radius: 12px;
      padding: 6px 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5), 0 0 12px var(--accent-glow);
      pointer-events: auto;
      user-select: none;
      animation: pop-up 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pop-up {
      0% { transform: scale(0.8) translateY(10px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .quick-menu button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--bd);
      color: var(--ink);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s ease;
    }
    .quick-menu button:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      box-shadow: 0 0 8px var(--accent-glow);
    }
    .quick-menu button:active {
      transform: scale(0.9);
    }
    .quick-menu button.danger:hover {
      background: #ef4444;
      border-color: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
    }
    .quick-menu #quick-cap-val {
      font-family: var(--fh);
      font-weight: 800;
      font-size: 14px;
      color: var(--ink);
      min-width: 16px;
      text-align: center;
    }
    .quick-menu .divider {
      color: var(--bd);
      font-weight: 300;
      font-size: 12px;
    }

    /* ── ROOM ACTIONS ── */
    .room-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--ink-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      margin-left: 4px;
    }
    .room-action-btn:hover {
      background: var(--accent);
      color: white;
    }
    .room-action-btn.danger:hover {
      background: #ef4444;
      color: white;
    }

    /* ── DRAG ALIGNMENT GUIDES ── */
    .drag-guide-x {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      border-left: 1px dashed rgba(16, 185, 129, 0.4);
      display: none;
      pointer-events: none;
      z-index: 5;
    }
    .drag-guide-y {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      border-top: 1px dashed rgba(16, 185, 129, 0.4);
      display: none;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>

  <script>
  // Activa el modo embebido si está en un iframe o ?embed=1 en la URL
  (function(){
    var isEmbedded = (window.self !== window.top) || new URLSearchParams(window.location.search).get('embed') === '1';
    if(isEmbedded) document.body.classList.add('embed-mode');
  })();
  </script>

  <!-- CABECERA -->
  <div class="tb">
    <div class="tb-l">
      <div class="tb-logo"><i class="fa-solid fa-utensils"></i></div>
      <div class="tb-title-container">
        <div class="tb-title" id="biz-name">PARCHE SYS</div>
        <div class="tb-subtitle">Mapa de Mesas Interactivo</div>
      </div>
    </div>
    <div class="tb-actions">
      <button class="btn" id="btn-reset-mesas" onclick="confirmarRestablecerDefectos()" style="display:none; border-color:rgba(239, 68, 68, 0.4); color:#ef4444">
        <i class="fa-solid fa-rotate-left"></i> Restablecer Plano
      </button>
      <button class="btn" id="btn-liberar-mesas" onclick="liberarTodasLasMesas()" style="display:none; border-color:#fb923c; color:#fb923c">
        <i class="fa-solid fa-square-check"></i> Liberar Mesas
      </button>
      <button class="btn" id="btn-add-mesa" onclick="addNuevaMesa()" style="display:none; border-color:var(--accent); color:var(--accent)">
        <i class="fa-solid fa-plus"></i> Nueva Mesa
      </button>
      <button class="btn" id="btn-edit-mode" onclick="toggleEditMode()">
        <i class="fa-solid fa-pencil"></i> Modo Editor
      </button>
      <button class="btn" id="btn-bg-lienzo" onclick="cambiarFondoLienzo()" style="display:none; color:var(--ink-muted); border-color:var(--bd)">
        <i class="fa-solid fa-image"></i> Editar Lienzo
      </button>
      <div style="width:1px; height:24px; background:var(--bd); margin:0 5px"></div>
      <a class="btn" href="pos-food.html?negocio=" id="link-pos"><i class="fa-solid fa-cash-register"></i> POS</a>
      <a class="btn primary" href="#" id="link-portal"><i class="fa-solid fa-table-cells-large"></i> Portal</a>
    </div>
  </div>

  <div class="toolbar">
    <div class="legend">
      <div class="l-item"><span class="dot" style="background:linear-gradient(135deg, #059669, #10b981)"></span> Libre</div>
      <div class="l-item"><span class="dot" style="background:linear-gradient(135deg, #d97706, #f59e0b)"></span> Ocupada</div>
      <div class="l-item"><span class="dot" style="background:linear-gradient(135deg, #dc2626, #ef4444)"></span> Cuenta</div>
      <div class="l-item"><span class="dot" style="background:#1f1f23; border: 1px solid #3f3f46"></span> Desconectada</div>
    </div>
    <div id="zoom-controls" style="margin-left:auto; display:none; gap:10px">
      <button class="btn" style="padding:6px 12px" onclick="zoomIn()"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
      <button class="btn" style="padding:6px 12px" onclick="zoomOut()"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
      <button class="btn" style="padding:6px 12px" onclick="resetZoom()"><i class="fa-solid fa-expand"></i></button>
    </div>
  </div>

  <!-- CONTENEDOR DEL LIENZO Y SELECTOR FLOTANTE -->
  <div class="canvas-bg" id="canvas-container">
    
    <!-- SELECTOR DE SALONES FLOTANTE -->
    <div class="rooms-bar" id="rooms-container">
      <!-- Tabs se inyectan dinámicamente -->
    </div>

    <!-- PANEL FLOTANTE DE CREACIÓN DE MESAS -->
    <div class="creator-palette" id="creator-palette">
      <div class="cp-title"><i class="fa-solid fa-circle-plus"></i> MESA</div>
      <div class="cp-items">
        <div class="cp-item" onclick="spawnShape('square')" title="Mesa Cuadrada">
          <div class="cp-preview square"></div>
          <span>Cuadrada</span>
        </div>
        <div class="cp-item" onclick="spawnShape('round')" title="Mesa Redonda">
          <div class="cp-preview round"></div>
          <span>Redonda</span>
        </div>
        <div class="cp-item" onclick="spawnShape('horiz')" title="Mesa Rectangular Horizontal">
          <div class="cp-preview horiz"></div>
          <span>Rect. H</span>
        </div>
        <div class="cp-item" onclick="spawnShape('vert')" title="Mesa Rectangular Vertical">
          <div class="cp-preview vert"></div>
          <span>Rect. V</span>
        </div>
        <div class="cp-item" onclick="spawnShape('large')" title="Mesa Grande">
          <div class="cp-preview large"></div>
          <span>Grande</span>
        </div>
      </div>
    </div>

    <div class="main-canvas" id="canvas">
      <!-- Guías de alineación -->
      <div class="drag-guide-x" id="drag-guide-x"></div>
      <div class="drag-guide-y" id="drag-guide-y"></div>

      <!-- Menú de acciones flotantes rápidas -->
      <div id="quick-menu" class="quick-menu">
        <button onclick="changeCap(-1)" title="Restar capacidad"><i class="fa-solid fa-minus"></i></button>
        <span id="quick-cap-val">4</span>
        <button onclick="changeCap(1)" title="Sumar capacidad"><i class="fa-solid fa-plus"></i></button>
        <div class="divider">|</div>
        <button onclick="cycleQuickShape()" title="Cambiar forma"><i class="fa-solid fa-shapes"></i></button>
        <div class="divider">|</div>
        <button onclick="quickDeleteMesa()" class="danger" title="Borrar mesa"><i class="fa-solid fa-trash"></i></button>
      </div>

      <!-- Mesas se cargan aquí -->
    </div>
  </div>

  <!-- PANEL DE EDICIÓN SLIDE-IN -->
  <div class="side-panel" id="side-panel">
    <div class="p-head">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>Editor de Mesa</h3>
        <button style="border:none; background:none; cursor:pointer; font-size:18px; color:var(--ink)" onclick="closeEditor()">✕</button>
      </div>
    </div>
    <div class="p-body">
      <div class="field-group">
        <label class="lbl">Número de Mesa</label>
        <input class="inp" id="edit-num" type="number" readonly>
      </div>
      <div class="field-group">
        <label class="lbl">Capacidad (Pax)</label>
        <input class="inp" id="edit-cap" type="number" value="4">
      </div>
      <div class="field-group">
        <label class="lbl">Forma y Tamaño</label>
        <div class="shape-grid">
          <div class="shape-btn" data-shape="square" onclick="setShape('square', this)"><i class="fa-solid fa-square"></i></div>
          <div class="shape-btn" data-shape="round" onclick="setShape('round', this)"><i class="fa-solid fa-circle"></i></div>
          <div class="shape-btn" data-shape="horiz" onclick="setShape('horiz', this)"><i class="fa-solid fa-minus" style="transform:scaleY(3)"></i></div>
          <div class="shape-btn" data-shape="vert" onclick="setShape('vert', this)"><i class="fa-solid fa-minus" style="transform:rotate(90deg) scaleY(3)"></i></div>
          <div class="shape-btn" data-shape="large" onclick="setShape('large', this)"><i class="fa-solid fa-expand"></i></div>
        </div>
      </div>
      <div class="field-group">
        <label class="lbl">Zona / Sector</label>
        <input class="inp" id="edit-zona" placeholder="Ej: INTERIOR">
      </div>
    </div>
    <div class="bottom-actions">
      <button class="btn" style="border-color:#EF4444; color:#EF4444; background: rgba(239, 68, 68, 0.05)" onclick="deleteMesa()">Borrar</button>
      <button class="btn primary" onclick="saveMesaChanges()">Guardar</button>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="modus-return.js"></script>
  <script>
    var _mesas = {};
    var _pedidos = {};
    var _editMode = false;
    var _zoom = 1;
    var _selectedMesaId = null;
    var _isDragging = false;
    var _currentDragMesa = null;
    var _offset = { x: 0, y: 0 };
    var _currentZona = "INTERIOR";
    var _isTablet = true;
    
    const CANVAS_WIDTH = 2400;
    const CANVAS_HEIGHT = 1600;

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('link-pos').href = (_isTablet ? 'pos-food-tablet.html' : 'pos-food.html') + '?negocio=' + negocioID;
      
      const btnPortal = document.getElementById('link-portal');
      if(btnPortal) {
        btnPortal.href = 'portal-food.html?negocio=' + negocioID;
      }

      db.ref('negocios/'+negocioID+'/info').on('value', s => {
        let inf = s.val() || {};
        document.getElementById('biz-name').textContent = inf.nombre || 'PARCHE SYS';
      });
      db.ref('negocios/'+negocioID+'/config/fondos_salones').on('value', s => {
        window._fondosSalones = s.val() || {};
        renderMesas();
      });

      db.ref('negocios/'+negocioID+'/mesas').on('value', snap => {
        _mesas = snap.val() || {};
        renderMesas();
        if(!window._firstLoadDone) {
          window._firstLoadDone = true;
          setTimeout(resetZoom, 400);
        }
      });

      window.addEventListener('resize', () => {
        if (!_isDragging) resetZoom();
      });

      db.ref('negocios/'+negocioID+'/pedidos').on('value', snap => {
        _pedidos = snap.val() || {};
        renderMesas();
      });

      setupDragging();
      centerCanvas();

      // Deselect and close quick menu when clicking on empty canvas space
      document.getElementById('canvas-container').addEventListener('click', (e) => {
        if (!_editMode) return;
        if (e.target.id === 'canvas-container' || e.target.id === 'canvas' || e.target.classList.contains('edit-grid')) {
          closeQuickMenu();
          document.querySelectorAll('.mesa').forEach(m => m.classList.remove('selected'));
          _selectedMesaId = null;
        }
      });

      // Double click to spawn table
      document.getElementById('canvas').addEventListener('dblclick', (e) => {
        if (!_editMode) return;
        if (e.target.id !== 'canvas' && !e.target.classList.contains('edit-grid')) return;
        
        const rect = e.currentTarget.getBoundingClientRect();
        const clickX = (e.clientX - rect.left) / _zoom;
        const clickY = (e.clientY - rect.top) / _zoom;
        
        const snappedX = Math.round(clickX / 10) * 10;
        const snappedY = Math.round(clickY / 10) * 10;
        
        spawnShapeAt('square', snappedX, snappedY);
      });

      // Custom double tap for mobile/tablets
      let lastTap = 0;
      document.getElementById('canvas').addEventListener('touchstart', (e) => {
        if (!_editMode) return;
        if (e.target.id !== 'canvas' && !e.target.classList.contains('edit-grid')) return;
        
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;
        if (tapLength < 300 && tapLength > 0) {
          e.preventDefault();
          const touch = e.touches[0];
          const rect = document.getElementById('canvas').getBoundingClientRect();
          const clickX = (touch.clientX - rect.left) / _zoom;
          const clickY = (touch.clientY - rect.top) / _zoom;
          
          const snappedX = Math.round(clickX / 10) * 10;
          const snappedY = Math.round(clickY / 10) * 10;
          
          spawnShapeAt('square', snappedX, snappedY);
        }
        lastTap = currentTime;
      });
    });

    // ── INICIALIZACIÓN POR DEFECTO DE LOS 4 SALONES ──
    function inicializarMapaMesasPorDefecto() {
      const defaultMesas = {};
      
      // 1. INTERIOR (Mesas 1 a 10)
      const interiorMesas = [
        { id: 1, forma: 'square', x: 150, y: 120, cap: 4 },
        { id: 2, forma: 'square', x: 280, y: 120, cap: 4 },
        { id: 3, forma: 'square', x: 410, y: 120, cap: 4 },
        { id: 4, forma: 'square', x: 540, y: 120, cap: 4 },
        { id: 5, forma: 'square', x: 670, y: 120, cap: 4 },
        { id: 6, forma: 'horiz',  x: 150, y: 260, cap: 6 },
        { id: 7, forma: 'horiz',  x: 340, y: 260, cap: 6 },
        { id: 8, forma: 'horiz',  x: 530, y: 260, cap: 6 },
        { id: 9, forma: 'vert',   x: 720, y: 230, cap: 6 },
        { id: 10, forma: 'vert',  x: 850, y: 230, cap: 6 }
      ];
      interiorMesas.forEach(m => {
        defaultMesas[m.id] = {
          capacidad: m.cap,
          estado: 'libre',
          forma: m.forma,
          x: m.x,
          y: m.y,
          zona: 'INTERIOR'
        };
      });

      // 2. MIRADOR (Mesas 11 a 15)
      const miradorMesas = [
        { id: 11, forma: 'round',  x: 200, y: 450, cap: 4 },
        { id: 12, forma: 'round',  x: 350, y: 450, cap: 4 },
        { id: 13, forma: 'round',  x: 500, y: 450, cap: 4 },
        { id: 14, forma: 'square', x: 650, y: 450, cap: 4 },
        { id: 15, forma: 'square', x: 800, y: 450, cap: 4 }
      ];
      miradorMesas.forEach(m => {
        defaultMesas[m.id] = {
          capacidad: m.cap,
          estado: 'libre',
          forma: m.forma,
          x: m.x,
          y: m.y,
          zona: 'MIRADOR'
        };
      });

      // 3. AREA GENERAL (Mesas 20 a 35) - Rejilla amplia en el centro
      let mesaNum = 20;
      for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 4; col++) {
          defaultMesas[mesaNum] = {
            capacidad: 4,
            estado: 'libre',
            forma: 'square',
            x: 180 + col * 180,
            y: 180 + row * 150,
            zona: 'AREA GENERAL'
          };
          mesaNum++;
        }
      }

      // 4. MESAS FRENTE A PISTA (Mesas 40 a 48) - Sector izquierdo
      const pistaMesas = [
        { id: 40, forma: 'square', x: 120, y: 150, cap: 4 },
        { id: 41, forma: 'square', x: 120, y: 280, cap: 4 },
        { id: 42, forma: 'square', x: 120, y: 410, cap: 4 },
        { id: 43, forma: 'square', x: 120, y: 540, cap: 4 },
        { id: 44, forma: 'round',  x: 280, y: 150, cap: 4 },
        { id: 45, forma: 'round',  x: 280, y: 280, cap: 4 },
        { id: 46, forma: 'round',  x: 280, y: 410, cap: 4 },
        { id: 47, forma: 'round',  x: 280, y: 540, cap: 4 },
        { id: 48, forma: 'large',  x: 440, y: 300, cap: 8 }
      ];
      pistaMesas.forEach(m => {
        defaultMesas[m.id] = {
          capacidad: m.cap,
          estado: 'libre',
          forma: m.forma,
          x: m.x,
          y: m.y,
          zona: 'MESAS FRENTE A PISTA'
        };
      });

      // Guardar todo en Firebase
      db.ref(`negocios/${negocioID}/mesas`).set(defaultMesas).then(() => {
        console.log("Salones y mesas inicializados.");
      });
    }

     // Función manual para el botón de restablecer en modo editor
    function confirmarRestablecerDefectos() {
      if (confirm('¿Estás seguro de que deseas restablecer el plano de mesas por defecto? Se eliminarán todas las mesas existentes y se recrearán las zonas predefinidas.')) {
        db.ref(`negocios/${negocioID}/mesas`).remove().then(() => {
          inicializarMapaMesasPorDefecto();
          closeEditor();
          closeQuickMenu();
          toast('Plano restablecido correctamente', 'ok');
        });
      }
    }

    function liberarTodasLasMesas() {
      if (confirm('¿Estás seguro de que deseas liberar todas las mesas? Esto establecerá su estado como "libre" y removerá los meseros y pedidos activos vinculados.')) {
        const updates = {};
        Object.keys(_mesas).forEach(id => {
          updates[`${id}/estado`] = 'libre';
          updates[`${id}/pedido_activo_id`] = null;
          updates[`${id}/mesero`] = '';
          updates[`${id}/personas`] = 1;
        });
        db.ref(`negocios/${negocioID}/mesas`).update(updates).then(() => {
          toast('Todas las mesas han sido liberadas', 'ok');
        }).catch(err => {
          console.error(err);
          toast('Error al liberar mesas', 'err');
        });
      }
    }

    function toggleEditMode() {
      _editMode = !_editMode;
      const btn = document.getElementById('btn-edit-mode');
      const addBtn = document.getElementById('btn-add-mesa');
      const bgBtn = document.getElementById('btn-bg-lienzo');
      const resetBtn = document.getElementById('btn-reset-mesas');
      const liberarBtn = document.getElementById('btn-liberar-mesas');
      const zoomControls = document.getElementById('zoom-controls');
      
      if(_editMode) {
        document.body.classList.add('editor-active');
        btn.classList.add('active');
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Finalizar Diseño';
        addBtn.style.display = 'flex';
        bgBtn.style.display = 'flex';
        resetBtn.style.display = 'flex';
        if(liberarBtn) liberarBtn.style.display = 'flex';
        if(zoomControls) zoomControls.style.display = 'flex';
      } else {
        document.body.classList.remove('editor-active');
        btn.classList.remove('active');
        btn.innerHTML = '<i class="fa-solid fa-pencil"></i> Modo Editor';
        addBtn.style.display = 'none';
        bgBtn.style.display = 'none';
        resetBtn.style.display = 'none';
        if(liberarBtn) liberarBtn.style.display = 'none';
        if(zoomControls) zoomControls.style.display = 'none';
        closeEditor();
        closeQuickMenu();
      }
      renderMesas();
    }

    function spawnShapeAt(shape, x, y) {
      const existingIds = Object.keys(_mesas).map(k => parseInt(k)).filter(k => !isNaN(k));
      const nextId = existingIds.length ? Math.max(...existingIds) + 1 : 1;
      
      const newMesa = {
        capacidad: 4,
        estado: 'libre',
        forma: shape,
        x: x,
        y: y,
        zona: _currentZona,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      db.ref(`negocios/${negocioID}/mesas/${nextId}`).set(newMesa);
      _selectedMesaId = nextId;
      renderMesas();
      setTimeout(() => {
        openQuickMenu(nextId);
      }, 100);
    }

    function spawnShape(shape) {
      const container = document.getElementById('canvas-container');
      if (!container) return;
      
      let centerX = (container.scrollLeft + container.clientWidth / 2) / _zoom;
      let centerY = (container.scrollTop + container.clientHeight / 2) / _zoom;
      
      centerX -= 50;
      centerY -= 50;
      
      centerX = Math.max(0, Math.round(centerX / 10) * 10);
      centerY = Math.max(0, Math.round(centerY / 10) * 10);
      
      spawnShapeAt(shape, centerX, centerY);
    }

    function addNuevaMesa() {
      spawnShape('square');
    }

    function renderMesas() {
      const canvas = document.getElementById('canvas');
      if(_isDragging) return;

      // Remove only mesas and edit grid to preserve guides and quick menu
      const elementsToRemove = canvas.querySelectorAll('.mesa, .edit-grid');
      elementsToRemove.forEach(el => el.remove());

      if(_editMode) {
        const grid = document.createElement('div');
        grid.className = 'edit-grid';
        canvas.insertBefore(grid, canvas.firstChild);
      }

      buildRoomTabs();

      if(window._fondosSalones && window._fondosSalones[_currentZona]) {
        let url = window._fondosSalones[_currentZona];
        if (url.includes('github.com') && url.includes('/blob/')) {
          url = url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
        }
        canvas.style.backgroundImage = `url('${url}')`;
        canvas.style.backgroundSize = 'contain';
        canvas.style.backgroundRepeat = 'no-repeat';
        canvas.style.backgroundPosition = 'center';
      } else {
        canvas.style.backgroundImage = 'none';
      }

      Object.entries(_mesas).forEach(([id, m]) => {
        let mz = m.zona || 'INTERIOR';
        if(mz !== _currentZona) return;

        const div = document.createElement('div');
        div.className = `mesa ${m.forma || 'square'} ${m.estado || 'libre'}`;
        div.id = `mesa-${id}`;
        
        let w = 100, h = 100;
        if(m.forma === 'horiz') { w = 160; h = 100; }
        else if(m.forma === 'vert') { w = 100; h = 160; }
        else if(m.forma === 'large') { w = 200; h = 200; }
        
        div.style.left = `${m.x || 100}px`;
        div.style.top = `${m.y || 100}px`;
        div.style.width = `${w}px`;
        div.style.height = `${h}px`;
        
        if(_selectedMesaId == id) div.classList.add('selected');

        div.innerHTML = `
          <span class="mesa-id">${id}</span>
          <span class="mesa-cap"><i class="fa-solid fa-user"></i> ${m.capacidad || 4}</span>
          <div class="edit-indicator"><i class="fa-solid fa-pencil"></i></div>
        `;

        div.onclick = (e) => handleMesaClick(id, e);
        div.onmousedown = (e) => handleMesaDown(id, e);
        div.ontouchstart = (e) => { e.preventDefault(); handleMesaDown(id, e.touches[0]); };

        canvas.appendChild(div);
      });

      if (_selectedMesaId && _editMode) {
        setTimeout(() => {
          openQuickMenu(_selectedMesaId);
        }, 50);
      } else {
        closeQuickMenu();
      }
    }

    function cambiarFondoLienzo() {
      if(!_editMode) return;
      const actual = (window._fondosSalones && window._fondosSalones[_currentZona]) || '';
      const resp = prompt(`URL del plano/imagen para el lienzo del salón '${_currentZona}' (deja vacío para quitarlo):`, actual);
      if(resp !== null) {
        db.ref(`negocios/${negocioID}/config/fondos_salones/${_currentZona}`).set(resp.trim());
      }
    }

    function handleMesaClick(id, e) {
      if(_isDragging) return;
      if (e) e.stopPropagation();
      
      _selectedMesaId = id;
      document.querySelectorAll('.mesa').forEach(m => m.classList.remove('selected'));
      const div = document.getElementById(`mesa-${id}`);
      if (div) div.classList.add('selected');

      if(_editMode) {
        openQuickMenu(id);
      } else {
        var isEmbedded = (window.self !== window.top) || new URLSearchParams(window.location.search).get('embed') === '1';
        if (isEmbedded) {
          irAlPOS(id);
        } else {
          irAlPOS(id);
        }
      }
    }

    function irAlPOS(mesaId, nuevo) {
      let page = _isTablet ? 'pos-food-tablet.html' : 'pos-food.html';
      let url = `${page}?negocio=${negocioID}&mesa=${mesaId}`;
      if(nuevo) url += '&nuevo=1';
      
      var isEmbedded = (window.self !== window.top) || new URLSearchParams(window.location.search).get('embed') === '1';
      if (isEmbedded) {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'selectMesa', mesaId: mesaId }, '*');
          if (typeof window.parent.selMesaModal === 'function') {
            window.parent.selMesaModal(mesaId);
          }
        } else {
          window.location.href = url;
        }
      } else {
        window.location.href = url;
      }
    }

    function openEditor(id) {
      const m = _mesas[id];
      _selectedMesaId = id;
      document.getElementById('edit-num').value = id;
      document.getElementById('edit-cap').value = m.capacidad || 4;
      document.getElementById('edit-zona').value = m.zona || '';
      
      document.querySelectorAll('.shape-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.shape == (m.forma || 'square'));
      });

      document.getElementById('side-panel').classList.add('open');
    }

    function closeEditor() {
      document.getElementById('side-panel').classList.remove('open');
      _selectedMesaId = null;
      renderMesas();
    }

    function setShape(shape, el) {
      document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      if(_selectedMesaId && _editMode) {
        db.ref(`negocios/${negocioID}/mesas/${_selectedMesaId}`).update({ forma: shape });
      }
    }

    function saveMesaChanges() {
      if(!_selectedMesaId) return;
      const num = _selectedMesaId;
      const cap = document.getElementById('edit-cap').value;
      const zona = document.getElementById('edit-zona').value.trim().toUpperCase();
      const activeShapeBtn = document.querySelector('.shape-btn.active');
      const forma = activeShapeBtn ? activeShapeBtn.dataset.shape : 'square';

      db.ref(`negocios/${negocioID}/mesas/${num}`).update({
        capacidad: parseInt(cap),
        zona: zona || 'INTERIOR',
        forma: forma
      });

      _currentZona = zona || 'INTERIOR';
      closeEditor();
      closeQuickMenu();
    }

    function deleteMesa() {
      if(!confirm('¿Eliminar la mesa ' + _selectedMesaId + '?')) return;
      db.ref(`negocios/${negocioID}/mesas/${_selectedMesaId}`).remove();
      closeEditor();
      closeQuickMenu();
    }

    function openQuickMenu(id) {
      const m = _mesas[id];
      if (!m) return;
      
      const quickMenu = document.getElementById('quick-menu');
      if (!quickMenu) return;
      
      quickMenu.style.display = 'flex';
      
      const tableX = m.x || 100;
      const tableY = m.y || 100;
      
      let w = 100;
      if (m.forma === 'horiz') w = 160;
      else if (m.forma === 'large') w = 200;
      
      quickMenu.style.left = `${tableX + w/2 - quickMenu.offsetWidth/2}px`;
      quickMenu.style.top = `${tableY - 60}px`;
      
      document.getElementById('quick-cap-val').textContent = m.capacidad || 4;
    }

    function closeQuickMenu() {
      const quickMenu = document.getElementById('quick-menu');
      if (quickMenu) quickMenu.style.display = 'none';
    }

    function changeCap(delta) {
      if (!_selectedMesaId) return;
      const m = _mesas[_selectedMesaId];
      if (!m) return;
      
      let newCap = (m.capacidad || 4) + delta;
      if (newCap < 1) newCap = 1;
      if (newCap > 20) newCap = 20;
      
      db.ref(`negocios/${negocioID}/mesas/${_selectedMesaId}`).update({ capacidad: newCap });
      document.getElementById('quick-cap-val').textContent = newCap;
      
      if (document.getElementById('side-panel').classList.contains('open')) {
        document.getElementById('edit-cap').value = newCap;
      }
    }

    function cycleQuickShape() {
      if (!_selectedMesaId) return;
      const m = _mesas[_selectedMesaId];
      if (!m) return;
      
      const shapes = ['square', 'round', 'horiz', 'vert', 'large'];
      let currentIdx = shapes.indexOf(m.forma || 'square');
      let nextIdx = (currentIdx + 1) % shapes.length;
      const nextShape = shapes[nextIdx];
      
      db.ref(`negocios/${negocioID}/mesas/${_selectedMesaId}`).update({ forma: nextShape });
      
      document.querySelectorAll('.shape-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.shape == nextShape);
      });
      
      setTimeout(() => {
        openQuickMenu(_selectedMesaId);
      }, 120);
    }

    function quickDeleteMesa() {
      if (!_selectedMesaId) return;
      if (confirm('¿Eliminar la mesa ' + _selectedMesaId + '?')) {
        db.ref(`negocios/${negocioID}/mesas/${_selectedMesaId}`).remove();
        closeQuickMenu();
        closeEditor();
      }
    }

    /* ── ROOMS LOGIC ── */
    function buildRoomTabs() {
      const container = document.getElementById('rooms-container');
      const zones = new Set();
      Object.values(_mesas).forEach(m => {
        if(m.zona) zones.add(m.zona);
      });
      
      if(zones.size === 0) {
        zones.add('INTERIOR');
        zones.add('MIRADOR');
        zones.add('AREA GENERAL');
        zones.add('MESAS FRENTE A PISTA');
      }
      
      if(!zones.has(_currentZona)) {
        _currentZona = Array.from(zones)[0] || 'INTERIOR';
      }

      let html = '<div style="font-size:10px; color:var(--accent); padding-right:8px; font-weight:800; display:flex; align-items:center; gap:5px; border-right:1px solid var(--bd); margin-right:6px"><i class="fa-solid fa-door-open" style="font-size:12px"></i> SALONES</div>';
      
      Array.from(zones).sort().forEach(z => {
        const isActive = z === _currentZona;
        html += `
          <div class="room-tab ${isActive ? 'active' : ''}" onclick="switchRoom('${z}')" style="display:flex; align-items:center; gap:6px">
            ${z}
            ${_editMode && isActive ? `
              <span class="room-action-btn" onclick="renameRoom('${z}', event)" title="Renombrar Salón"><i class="fa-solid fa-pen"></i></span>
              <span class="room-action-btn danger" onclick="deleteRoom('${z}', event)" title="Eliminar Salón"><i class="fa-solid fa-trash"></i></span>
            ` : ''}
          </div>`;
      });
      
      if(_editMode) {
        html += `<button class="btn-add-room" onclick="addRoom()"><i class="fa-solid fa-plus"></i> Crear Salón</button>`;
      }
      container.innerHTML = html;
    }

    function renameRoom(zonaStr, e) {
      if (e) e.stopPropagation();
      const newName = prompt(`Renombrar el salón '${zonaStr}' a:`, zonaStr);
      if (!newName || newName.trim().toUpperCase() === zonaStr) return;
      const cleanedName = newName.trim().toUpperCase();
      
      const updates = {};
      Object.entries(_mesas).forEach(([id, m]) => {
        if (m.zona === zonaStr) {
          updates[`${id}/zona`] = cleanedName;
        }
      });
      
      if (Object.keys(updates).length > 0) {
        db.ref(`negocios/${negocioID}/mesas`).update(updates).then(() => {
          _currentZona = cleanedName;
          toast('Salón renombrado correctamente', 'ok');
        });
      } else {
        _currentZona = cleanedName;
        renderMesas();
      }
    }

    function deleteRoom(zonaStr, e) {
      if (e) e.stopPropagation();
      if (!confirm(`¿Estás seguro de que deseas eliminar el salón '${zonaStr}' y TODAS sus mesas? Esta acción no se puede deshacer.`)) return;
      
      const updates = {};
      Object.entries(_mesas).forEach(([id, m]) => {
        if (m.zona === zonaStr) {
          updates[id] = null;
        }
      });
      
      db.ref(`negocios/${negocioID}/mesas`).update(updates).then(() => {
        toast('Salón eliminado', 'ok');
        const remainingZones = new Set();
        Object.values(_mesas).forEach(m => {
          if (m.zona && m.zona !== zonaStr) remainingZones.add(m.zona);
        });
        _currentZona = Array.from(remainingZones)[0] || 'INTERIOR';
        renderMesas();
      });
    }

    function switchRoom(zonaStr) {
      if(_isDragging) return;
      _currentZona = zonaStr;
      _selectedMesaId = null;
      renderMesas();
      setTimeout(resetZoom, 100);
    }

    function addRoom() {
      const resp = prompt("Nombre del nuevo salón (Ej. TERRAZA):");
      if(!resp) return;
      _currentZona = resp.trim().toUpperCase();
      spawnShape('square');
    }

    /* ── DRAGGING LOGIC ── */
    function handleMesaDown(id, e) {
      if(!_editMode) return;
      _isDragging = true;
      _currentDragMesa = id;
      const div = document.getElementById(`mesa-${id}`);
      div.classList.add('dragging');
      
      closeQuickMenu();
      
      const rect = div.getBoundingClientRect();
      _offset.x = ((e.clientX !== undefined ? e.clientX : e.touches?.[0].clientX) - rect.left) / _zoom;
      _offset.y = ((e.clientY !== undefined ? e.clientY : e.touches?.[0].clientY) - rect.top) / _zoom;
    }

    function setupDragging() {
      const canvas = document.getElementById('canvas');
      
      const moveHandler = (e) => {
        if(!_isDragging || !_currentDragMesa) return;
        
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const canvasRect = canvas.getBoundingClientRect();
        let x = (clientX - canvasRect.left) / _zoom - _offset.x;
        let y = (clientY - canvasRect.top) / _zoom - _offset.y;

        // Tamaño real de la mesa actual para el límite de arrastre
        let w = 100, h = 100;
        const currentMesa = _mesas[_currentDragMesa];
        if (currentMesa) {
          if (currentMesa.forma === 'horiz') { w = 160; }
          else if (currentMesa.forma === 'vert') { h = 160; }
          else if (currentMesa.forma === 'large') { w = 200; h = 200; }
        }

        x = Math.max(0, Math.min(x, CANVAS_WIDTH - w));
        y = Math.max(0, Math.min(y, CANVAS_HEIGHT - h));
        
        // Magnetismo o snap a cuadrícula de 10px
        x = Math.round(x / 10) * 10;
        y = Math.round(y / 10) * 10;

        const div = document.getElementById(`mesa-${_currentDragMesa}`);
        if(div) {
          div.style.left = `${x}px`;
          div.style.top = `${y}px`;
        }

        // Show alignment guides
        const guideX = document.getElementById('drag-guide-x');
        const guideY = document.getElementById('drag-guide-y');
        if (guideX && guideY) {
          guideX.style.display = 'block';
          guideY.style.display = 'block';
          guideX.style.left = `${x + w/2}px`;
          guideY.style.top = `${y + h/2}px`;
        }
      };

      const upHandler = () => {
        if(!_isDragging) return;
        
        const div = document.getElementById(`mesa-${_currentDragMesa}`);
        if(!div) return;
        const x = parseInt(div.style.left);
        const y = parseInt(div.style.top);

        const guideX = document.getElementById('drag-guide-x');
        const guideY = document.getElementById('drag-guide-y');
        if (guideX && guideY) {
          guideX.style.display = 'none';
          guideY.style.display = 'none';
        }

        db.ref(`negocios/${negocioID}/mesas/${_currentDragMesa}`).update({ x, y });

        _isDragging = false;
        const draggedMesaId = _currentDragMesa;
        _currentDragMesa = null;
        div.classList.remove('dragging');

        setTimeout(() => {
          openQuickMenu(draggedMesaId);
        }, 50);
      };

      document.addEventListener('mousemove', moveHandler);
      document.addEventListener('touchmove', moveHandler, { passive: false });
      
      document.addEventListener('mouseup', upHandler);
      document.addEventListener('touchend', upHandler);
    }

    /* ── ZOOM & PAN ── */
    function zoomIn() { _zoom += 0.1; updateZoom(); }
    function zoomOut() { if(_zoom > 0.3) _zoom -= 0.1; updateZoom(); }
    
    function resetZoom() {
      const container = document.getElementById('canvas-container');
      if (!container) return;
      
      const width = container.clientWidth;
      const height = container.clientHeight;
      
      const mesas = Object.values(_mesas).filter(m => (m.zona || 'INTERIOR') === _currentZona);
      
      let minX = 0, maxX = 1200;
      let minY = 0, maxY = 800;
      
      if (mesas.length > 0) {
        minX = Math.min(...mesas.map(m => m.x || 0)) - 60;
        maxX = Math.max(...mesas.map(m => {
          let w = 100;
          if (m.forma === 'horiz') w = 160;
          else if (m.forma === 'large') w = 200;
          return (m.x || 0) + w;
        })) + 60;
        minY = Math.min(...mesas.map(m => m.y || 0)) - 60;
        maxY = Math.max(...mesas.map(m => {
          let h = 100;
          if (m.forma === 'vert') h = 160;
          else if (m.forma === 'large') h = 200;
          return (m.y || 0) + h;
        })) + 60;
      }
      
      minX = Math.min(minX, 0);
      maxX = Math.max(maxX, 1200);
      minY = Math.min(minY, 0);
      maxY = Math.max(maxY, 800);
      
      const contentWidth = maxX - minX;
      const contentHeight = maxY - minY;
      
      const scaleX = width / contentWidth;
      const scaleY = height / contentHeight;
      
      _zoom = Math.min(scaleX, scaleY);
      _zoom = Math.max(0.25, Math.min(_zoom, 1.2));
      
      updateZoom();
      
      container.scrollLeft = (minX * _zoom) - (width - contentWidth * _zoom) / 2;
      container.scrollTop = (minY * _zoom) - (height - contentHeight * _zoom) / 2;
    }

    function updateZoom() {
      document.getElementById('canvas').style.transform = `scale(${_zoom})`;
    }

    function centerCanvas() {
      // Centra el canvas inicialmente en el contenedor
      const container = document.getElementById('canvas-container');
      if (container) {
        container.scrollLeft = (CANVAS_WIDTH - container.clientWidth) / 2;
        container.scrollTop = (CANVAS_HEIGHT - container.clientHeight) / 2;
      }
    }

    // Helper de notificaciones en pantalla tipo toast
    function toast(msg, type) {
      const t = document.createElement('div');
      t.style.cssText = `
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: ${type === 'ok' ? 'rgba(16, 185, 129, 0.95)' : 'rgba(239, 68, 68, 0.95)'};
        color: white; padding: 12px 24px; border-radius: 12px; font-weight: 700;
        font-size: 13px; z-index: 10000; box-shadow: 0 4px 15px rgba(0,0,0,0.25);
        backdrop-filter: blur(8px); transition: all 0.3s ease; opacity: 0;
      `;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.style.opacity = '1', 50);
      setTimeout(() => {
        t.style.opacity = '0';
        setTimeout(() => t.remove(), 300);
      }, 3000);
    }
  </script>
