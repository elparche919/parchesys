<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PARCHE SYS · Control de Inventario</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase compat libraries (Local first) -->
  <script src="firebase-app-compat.js"></script>
  <script src="firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #ea580c;
      --primary-gradient: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
      --primary-light: rgba(234, 88, 12, 0.1);
      --accent: #f59e0b;
      --accent-light: rgba(245, 158, 11, 0.15);
      --background: #0f172a;
      --surface: #1e293b;
      --surface-light: #2d3748;
      --surface-gradient: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --red: #ef4444;
      --red-gradient: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      --green: #10b981;
      --green-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --blue: #3b82f6;
      --blue-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--background);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 30px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ─── HEADER ───────────────────────────────────────────────────── */
    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      background: var(--primary-gradient);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.35);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .conn-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(255,255,255,0.05);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .conn-status.connected i { color: var(--green); }
    .conn-status.disconnected i { color: var(--red); }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      background: var(--primary-light);
      border: 1px solid rgba(234, 88, 12, 0.2);
      padding: 6px 14px;
      border-radius: 20px;
      color: #ff9d66;
    }

    .btn-action {
      background: var(--primary-gradient);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3);
    }
    .btn-action:active { transform: scale(0.95); }
    .btn-action:hover { box-shadow: 0 6px 16px rgba(234, 88, 12, 0.45); }

    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--red);
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-logout:active { transform: scale(0.95); }
    .btn-logout:hover { background: rgba(239, 68, 68, 0.25); }

    /* ─── TOOLBAR ──────────────────────────────────────────────────── */
    .toolbar-wrap {
      padding: 20px 24px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-container {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: white;
      padding: 16px 20px 16px 52px;
      font-size: 16px;
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      font-size: 18px;
    }

    /* ─── CATEGORY TABS ────────────────────────────────────────────── */
    .cat-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .cat-tabs::-webkit-scrollbar { display: none; }

    .cat-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 12px 22px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }
    .cat-tab.active {
      background: var(--primary-gradient);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 10px rgba(234, 88, 12, 0.25);
    }

    /* ─── PRODUCT GRID ─────────────────────────────────────────────── */
    .grid-container {
      padding: 10px 24px 30px;
    }

    .prod-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    /* ─── PRODUCT CARD ─────────────────────────────────────────────── */
    .prod-card {
      height: 180px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      transition: transform 0.15s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.15s;
    }
    .prod-card:active { transform: scale(0.96); }
    .prod-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
      border-color: rgba(255,255,255,0.2);
    }

    /* Gradient presets */
    .prod-card:nth-child(6n+1) { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
    .prod-card:nth-child(6n+2) { background: linear-gradient(135deg, #064e3b 0%, #10b981 100%); }
    .prod-card:nth-child(6n+3) { background: linear-gradient(135deg, #7c2d12 0%, #ea580c 100%); }
    .prod-card:nth-child(6n+4) { background: linear-gradient(135deg, #701a75 0%, #d946ef 100%); }
    .prod-card:nth-child(6n+5) { background: linear-gradient(135deg, #4c1d95 0%, #8b5cf6 100%); }
    .prod-card:nth-child(6n+6) { background: linear-gradient(135deg, #0f172a 0%, #334155 100%); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .card-emoji {
      font-size: 38px;
    }

    .stock-badge {
      font-size: 11px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .stock-badge.unlimited { background: rgba(59, 130, 246, 0.8); color: white; }
    .stock-badge.ok { background: rgba(16, 185, 129, 0.85); color: white; }
    .stock-badge.low { background: #ea580c; color: white; animation: pulse 2s infinite; }
    .stock-badge.empty { background: var(--red); color: white; }
    .stock-badge.inactive { background: #4b5563; color: white; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-name {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: white;
      line-height: 1.25;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-price {
      font-size: 16px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .card-cat-tag {
      font-size: 10px;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.8);
    }

    /* ─── MODAL OVERLAY ────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }

    .modal-card {
      background: var(--surface-gradient);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      animation: modalSlide 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalSlide {
      from { transform: scale(0.92) translateY(20px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 800;
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.06);
      border: none;
      color: var(--text-sub);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-close:hover { background: rgba(255, 255, 255, 0.12); color: white; }

    .modal-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group.col-span-2 {
      grid-column: span 2;
    }
    @media (max-width: 600px) {
      .form-group.col-span-2 { grid-column: span 1; }
    }

    label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .form-control {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      color: white;
      padding: 12px 16px;
      font-size: 15px;
      border-radius: var(--radius-md);
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }
    .form-control:focus { border-color: var(--primary); }

    .form-row {
      display: flex;
      gap: 12px;
    }

    /* Switches */
    .switch-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .switch-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .switch-label span { font-weight: 700; font-size: 14px; }
    .switch-label small { color: var(--text-sub); font-size: 11px; }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #4b5563;
      transition: .3s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(22px); }

    .modal-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: white;
      padding: 14px 24px;
      border-radius: var(--radius-md);
      font-weight: 700;
      cursor: pointer;
      flex: 1;
      text-align: center;
      transition: background-color 0.2s;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.14); }

    .btn-primary {
      background: var(--primary-gradient);
      border: none;
      color: white;
      padding: 14px 24px;
      border-radius: var(--radius-md);
      font-weight: 800;
      cursor: pointer;
      flex: 2;
      text-align: center;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.3);
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:hover { box-shadow: 0 6px 18px rgba(234, 88, 12, 0.45); }

    .btn-danger {
      background: var(--red-gradient);
      border: none;
      color: white;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: transform 0.1s;
    }
    .btn-danger:active { transform: scale(0.95); }

    /* ─── LOW STOCK ALERTS PANEL ───────────────────────────────────── */
    .low-stock-panel {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.08) 0%, rgba(245, 158, 11, 0.05) 100%);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: var(--radius-lg);
      margin: 16px 24px 0;
      padding: 16px 20px;
      display: none; /* Controlled via JS */
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(8px);
    }

    .low-stock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .low-stock-title {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: #fca5a5;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .low-stock-count-badge {
      background: var(--red);
      color: white;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
    }

    .low-stock-toggle-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
    }
    .low-stock-toggle-btn:hover {
      color: white;
    }

    .low-stock-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 4px;
      transition: max-height 0.3s ease;
    }
    .low-stock-list.collapsed {
      max-height: 0;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* Scrollbar for low stock list */
    .low-stock-list::-webkit-scrollbar {
      width: 6px;
    }
    .low-stock-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 3px;
    }
    .low-stock-list::-webkit-scrollbar-thumb {
      background: rgba(239, 68, 68, 0.3);
      border-radius: 3px;
    }
    .low-stock-list::-webkit-scrollbar-thumb:hover {
      background: rgba(239, 68, 68, 0.5);
    }

    .low-stock-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(239, 68, 68, 0.15);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s, background-color 0.15s;
    }
    .low-stock-item:hover {
      transform: translateY(-2px);
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.05);
    }
    .low-stock-item:active {
      transform: scale(0.98);
    }

    .low-stock-item-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .low-stock-item-emoji {
      font-size: 22px;
      flex-shrink: 0;
    }

    .low-stock-item-name-group {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .low-stock-item-name {
      font-size: 14px;
      font-weight: 700;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .low-stock-item-variant {
      font-size: 11px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .low-stock-item-badge {
      font-size: 11px;
      font-weight: 800;
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 3px 8px;
      border-radius: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.ok { border-color: var(--green); }
    .toast.warn { border-color: var(--accent); }
    .toast.err { border-color: var(--red); }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand-group">
      <div class="brand-logo"><i class="fa-solid fa-boxes-stacked"></i></div>
      <div class="brand-title">PARCHE INVENTARIO</div>
    </div>
    
    <div class="header-controls">
      <div class="conn-status disconnected" id="conn-indicator"><i class="fa-solid fa-circle"></i> <span id="conn-text">Sin Conexión</span></div>
      <div class="user-badge" id="user-badge"><i class="fa-regular fa-user"></i> <span id="user-name">Administrador</span></div>
      <button class="btn-action" onclick="openCreateModal()"><i class="fa-solid fa-plus"></i> Nuevo Producto</button>
      <button class="btn-logout" onclick="logout()" title="Cerrar sesión"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
  </header>

  <!-- LOW STOCK PANEL -->
  <div class="low-stock-panel" id="low-stock-panel">
    <div class="low-stock-header" onclick="toggleLowStockList()">
      <div class="low-stock-title">
        <i class="fa-solid fa-triangle-exclamation"></i> Alertas de Stock Bajo
        <span class="low-stock-count-badge" id="low-stock-count">0</span>
      </div>
      <button class="low-stock-toggle-btn" id="low-stock-toggle-btn">
        <i class="fa-solid fa-chevron-up"></i> Ocultar
      </button>
    </div>
    <div class="low-stock-list" id="low-stock-list">
      <!-- Low stock items will be injected here -->
    </div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar-wrap">
    <div class="search-container">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" class="search-input" id="search-input" placeholder="Buscar productos por nombre..." oninput="filtrarProductos()">
    </div>
    
    <div class="cat-tabs" id="cat-tabs">
      <div class="cat-tab active">Todos</div>
    </div>
  </div>

  <!-- PRODUCT GRID -->
  <div class="grid-container">
    <div class="prod-grid" id="prod-grid">
      <!-- Cards rendered here -->
    </div>
  </div>

  <!-- PRODUCT MODAL OVERLAY -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Editar Producto</h3>
        <button class="btn-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <div class="modal-body">
        <div class="form-grid">
          
          <div class="form-group col-span-2">
            <label for="p-name">Nombre del Producto</label>
            <input type="text" class="form-control" id="p-name" placeholder="Ej. Hamburguesa Especial">
          </div>

          <div class="form-group">
            <label for="p-cat-select">Categoría</label>
            <div class="form-row">
              <select class="form-control" id="p-cat-select" onchange="syncCategoryInput(this.value)">
                <!-- Existing categories populated here -->
              </select>
              <input type="text" class="form-control" id="p-cat-custom" placeholder="Nueva Categoría" style="display:none">
              <button class="btn-secondary" id="btn-toggle-cat" onclick="toggleCustomCategory()" style="padding: 12px; max-width: 50px;" title="Nueva categoría"><i class="fa-solid fa-plus"></i></button>
            </div>
          </div>

          <div class="form-group">
            <label for="p-price">Precio de Venta ($)</label>
            <input type="number" class="form-control" id="p-price" step="0.01" min="0" placeholder="0.00">
          </div>

          <div class="form-group">
            <label for="p-emoji">Ícono / Emoji</label>
            <input type="text" class="form-control" id="p-emoji" placeholder="Ej. 🍔">
          </div>

          <div class="form-group">
            <label for="p-stock">Stock / Mín. Alerta</label>
            <div class="form-row">
              <input type="number" class="form-control" id="p-stock" step="1" min="0" placeholder="Stock" style="flex:1">
              <input type="number" class="form-control" id="p-stock-minimo" step="1" min="0" placeholder="Mín. Alerta" style="flex:1">
            </div>
          </div>

          <div class="form-group col-span-2">
            <div class="switch-group">
              <div class="switch-label">
                <span>Descuenta Stock</span>
                <small>Habilita el control de inventario para este producto</small>
              </div>
              <label class="switch">
                <input type="checkbox" id="p-desc-stock" onchange="toggleStockField(this.checked)">
                <span class="slider"></span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <div class="switch-group">
              <div class="switch-label">
                <span>Disponible</span>
                <small>Permitir ordenar en el POS</small>
              </div>
              <label class="switch">
                <input type="checkbox" id="p-disponible" checked>
                <span class="slider"></span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <div class="switch-group">
              <div class="switch-label">
                <span>Activo</span>
                <small>Mostrar en base de datos</small>
              </div>
              <label class="switch">
                <input type="checkbox" id="p-activo" checked>
                <span class="slider"></span>
              </label>
            </div>
          </div>

          <!-- VARIACIONES -->
          <div class="form-group col-span-2" style="border-top: 1px solid var(--border); padding-top: 15px; margin-top: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
              <label style="font-size: 14px; font-weight: 800; color: white;">Variaciones del Producto</label>
              <button class="btn-action" style="padding: 6px 12px; font-size: 12px; font-weight: 700; box-shadow: none;" onclick="addInventarioVariante(event)">
                <i class="fa-solid fa-plus"></i> Agregar Variante
              </button>
            </div>
            <div id="i-var-list" style="display: flex; flex-direction: column; gap: 8px;">
              <!-- Variantes lists here -->
            </div>
          </div>

          <div class="form-group col-span-2">
            <label for="p-desc">Descripción</label>
            <textarea class="form-control" id="p-desc" rows="2" placeholder="Detalles o ingredientes..."></textarea>
          </div>

        </div>
      </div>
      
      <div class="modal-footer">
        <button class="btn-danger" id="btn-delete-product" onclick="eliminarProducto()" style="display:none">Eliminar</button>
        <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn-primary" onclick="guardarProducto()">Guardar Cambios</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast" id="toast-notif">
    <span id="toast-icon">ℹ️</span>
    <span id="toast-text">Notificación</span>
  </div>

  <!-- Firebase configuration and app logic -->
  <script src="firebase-config.js"></script>
  <script>
    var _prods = {};
    var _categories = new Set();
    var _selectedCat = 'Todos';
    var _currentEditingId = null;
    var _currentEditingOriginalCat = null;
    var _isCustomCategoryMode = false;

    // Check auth on load
    var empActive = localStorage.getItem('empleado_activo');
    if (empActive) {
      try {
        var emp = JSON.parse(empActive);
        document.getElementById('user-name').textContent = emp.nombre || "Administrador";
      } catch (e) {
        document.getElementById('user-name').textContent = empActive;
      }
    }

    // Monitor Firebase connection status
    if (window.db) {
      db.ref('.info/connected').on('value', function(snap) {
        var connInd = document.getElementById('conn-indicator');
        var connTxt = document.getElementById('conn-text');
        if (snap.val() === true) {
          connInd.className = "conn-status connected";
          connTxt.textContent = "Conectado";
        } else {
          connInd.className = "conn-status disconnected";
          connTxt.textContent = "Sin Conexión";
        }
      });
      
      cargarProductos();
      
      // Escuchar notificaciones globales (como stock bajo)
      try {
        var globalNotifRef = db.ref('negocios/' + negocioID + '/notificaciones').orderByChild('fecha').limitToLast(5);
        globalNotifRef.on('child_added', function(snap) {
          var notifKey = snap.key;
          var notif = snap.val();
          if (!notif) return;
          
          var shownKey = 'shown_notif_' + negocioID + '_' + notifKey;
          if (localStorage.getItem(shownKey)) return;
          
          var notifTime = new Date(notif.fecha).getTime();
          if (Date.now() - notifTime > 60000) return; // Omitir alertas viejas
          
          localStorage.setItem(shownKey, 'true');
          
          if (notif.tipo === 'stock_bajo') {
            showToast("⚠️ " + notif.titulo + ": " + notif.mensaje, "warn");
            
            if (window.AndroidBridge && typeof window.AndroidBridge.showNativeNotification === 'function') {
              try {
                window.AndroidBridge.showNativeNotification('⚠️ ' + notif.titulo, notif.mensaje);
              } catch(err) {
                console.error("Error calling AndroidBridge:", err);
              }
            } else if ('Notification' in window && Notification.permission === 'granted') {
              try {
                new Notification('⚠️ ' + notif.titulo, { body: notif.mensaje, icon: 'LOGOPARCHESYS.png' });
              } catch(e) {}
            }
          }
        });
        
        // Solicitar permiso de notificaciones push del sistema/navegador
        if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
          Notification.requestPermission();
        }
      } catch(e) {
        console.error("Error en notificaciones:", e);
      }
    } else {
      showToast("❌ Error: Firebase no inicializado", "err");
    }

    function cargarProductos() {
      db.ref('negocios/' + negocioID + '/productos').on('value', function(snap) {
        _prods = {};
        _categories = new Set(['Todos']);
        
        snap.forEach(function(catSnap) {
          var items = catSnap.val();
          if (typeof items === 'object' && items !== null && !items.nombre) {
            _categories.add(catSnap.key);
            Object.keys(items).forEach(function(id) {
              var p = items[id];
              if (p && p.nombre) {
                p._id = id;
                p._cat = catSnap.key;
                _prods[id] = p;
              }
            });
          } else {
            var p = catSnap.val();
            if (p && p.nombre) {
              p._id = catSnap.key;
              p._cat = p.categoria || p.cat || 'General';
              _prods[catSnap.key] = p;
              _categories.add(p._cat);
            }
          }
        });

        renderCatTabs();
        renderProductGrid();
        renderLowStockAlerts();
        populateCategorySelect();
      });
    }

    var _lowStockCollapsed = false;
    var _prevStockState = {};

    function toggleLowStockList() {
      var list = document.getElementById('low-stock-list');
      var btn = document.getElementById('low-stock-toggle-btn');
      _lowStockCollapsed = !_lowStockCollapsed;
      
      if (_lowStockCollapsed) {
        list.classList.add('collapsed');
        btn.innerHTML = '<i class="fa-solid fa-chevron-down"></i> Mostrar';
      } else {
        list.classList.remove('collapsed');
        btn.innerHTML = '<i class="fa-solid fa-chevron-up"></i> Ocultar';
      }
    }

    function renderLowStockAlerts() {
      var panel = document.getElementById('low-stock-panel');
      var list = document.getElementById('low-stock-list');
      var countBadge = document.getElementById('low-stock-count');
      
      var lowStockItems = [];
      
      Object.values(_prods).forEach(function(p) {
        if (p.activo === false || p.disponible === false || p.oculto === true) return;
        var descStock = !!p.descuenta;
        if (!descStock) return;
        
        var hasVariants = p.variantes && p.variantes.length > 0;
        var emoji = p.emoji || p.icono || '🍽️';
        
        if (hasVariants) {
          p.variantes.forEach(function(v, index) {
            var vStock = parseInt(v.stock || 0);
            var vMin = v.stockMinimo !== undefined ? parseInt(v.stockMinimo) : 5;
            var key = p._id + '_' + index;
            
            if (vStock <= vMin) {
              lowStockItems.push({
                id: p._id,
                nombre: p.nombre,
                variante: v.nombre || v.n || ('Variante ' + (index + 1)),
                stock: vStock,
                stockMinimo: vMin,
                emoji: emoji
              });
              
              if (_prevStockState[key] !== undefined && _prevStockState[key] > vMin) {
                var title = 'Stock Bajo: ' + p.nombre;
                var msg = 'La variante ' + (v.nombre || v.n || ('Var ' + (index+1))) + ' bajó a ' + vStock + ' unidades.';
                if (window.AndroidBridge && typeof window.AndroidBridge.showNativeNotification === 'function') {
                  try {
                    window.AndroidBridge.showNativeNotification(title, msg);
                  } catch(e) {}
                }
              }
            }
            _prevStockState[key] = vStock;
          });
        } else {
          var stock = parseFloat(p.stockFijo || 0);
          var minLimit = p.stockMinimo !== undefined ? parseFloat(p.stockMinimo) : 5;
          var key = p._id;
          
          if (stock <= minLimit) {
            lowStockItems.push({
              id: p._id,
              nombre: p.nombre,
              variante: null,
              stock: stock,
              stockMinimo: minLimit,
              emoji: emoji
            });
            
            if (_prevStockState[key] !== undefined && _prevStockState[key] > minLimit) {
              var title = 'Stock Bajo: ' + p.nombre;
              var msg = 'El stock de ' + p.nombre + ' bajó a ' + stock + ' unidades.';
              if (window.AndroidBridge && typeof window.AndroidBridge.showNativeNotification === 'function') {
                try {
                  window.AndroidBridge.showNativeNotification(title, msg);
                } catch(e) {}
              }
            }
          }
          _prevStockState[key] = stock;
        }
      });
      
      countBadge.textContent = lowStockItems.length;
      
      if (lowStockItems.length === 0) {
        panel.style.display = 'none';
        return;
      }
      
      panel.style.display = 'flex';
      
      list.innerHTML = lowStockItems.map(function(item) {
        var subtitle = item.variante ? '<span class="low-stock-item-variant">' + item.variante + '</span>' : '';
        var warningText = item.stock <= 0 ? 'Agotado' : 'Stock: ' + item.stock;
        var badgeColor = item.stock <= 0 ? 'var(--red)' : '#fca5a5';
        
        return '<div class="low-stock-item" onclick="openEditModal(\'' + item.id + '\')">'
          + '<div class="low-stock-item-info">'
            + '<div class="low-stock-item-emoji">' + item.emoji + '</div>'
            + '<div class="low-stock-item-name-group">'
              + '<span class="low-stock-item-name">' + item.nombre + '</span>'
              + subtitle
            + '</div>'
          + '</div>'
          + '<div class="low-stock-item-badge" style="color: ' + badgeColor + '">'
            + '<i class="fa-solid fa-triangle-exclamation"></i> ' + warningText
          + '</div>'
          + '</div>';
      }).join('');
    }

    function verificarYNotificarStockBajo(p) {
      if (p.activo === false || p.disponible === false) return;
      if (!p.descuenta) return;
      
      var hasVariants = p.variantes && p.variantes.length > 0;
      if (hasVariants) {
        p.variantes.forEach(function(v, index) {
          var vStock = parseInt(v.stock || 0);
          var vMin = v.stockMinimo !== undefined ? parseInt(v.stockMinimo) : 5;
          if (vStock <= vMin) {
            pushStockBajoNotification(p.nombre + ' (' + (v.nombre || v.n || ('Var ' + (index+1))) + ')', vStock, vMin);
          }
        });
      } else {
        var stock = parseFloat(p.stockFijo || 0);
        var minLimit = p.stockMinimo !== undefined ? parseFloat(p.stockMinimo) : 5;
        if (stock <= minLimit) {
          pushStockBajoNotification(p.nombre, stock, minLimit);
        }
      }
    }

    function pushStockBajoNotification(name, stock, min) {
      var msg = 'El producto ' + name + ' está con stock crítico de ' + stock + ' (mínimo ' + min + ')';
      var notifData = {
        tipo: 'stock_bajo',
        titulo: 'Stock Bajo: ' + name,
        mensaje: msg,
        fecha: new Date().toISOString()
      };
      
      db.ref('negocios/' + negocioID + '/notificaciones').push(notifData);
    }

    function renderCatTabs() {
      var container = document.getElementById('cat-tabs');
      var cats = Array.from(_categories);
      
      container.innerHTML = cats.map(function(cat) {
        var active = cat === _selectedCat ? 'active' : '';
        return '<div class="cat-tab ' + active + '" onclick="selectCategory(\'' + cat + '\')">' + cat + '</div>';
      }).join('');
    }

    function selectCategory(cat) {
      _selectedCat = cat;
      renderCatTabs();
      renderProductGrid();
    }

    function renderProductGrid() {
      var grid = document.getElementById('prod-grid');
      var query = document.getElementById('search-input').value.toLowerCase().trim();
      
      var filtered = Object.values(_prods);
      
      if (_selectedCat !== 'Todos') {
        filtered = filtered.filter(function(p) { return p._cat === _selectedCat; });
      }
      
      if (query !== '') {
        filtered = filtered.filter(function(p) {
          return p.nombre.toLowerCase().includes(query) || (p.descripcion && p.descripcion.toLowerCase().includes(query));
        });
      }

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-sub);font-size:15px"><i class="fa-regular fa-folder-open" style="font-size:48px;display:block;margin-bottom:12px;opacity:0.4"></i>Sin productos que coincidan</div>';
        return;
      }

      grid.innerHTML = filtered.map(function(p) {
        var isAgotado = p.disponible === false || p.activo === false || p.oculto === true;
        var descStock = !!p.descuenta;
        var stock = parseFloat(p.stockFijo || 0);

        var badgeClass = 'unlimited';
        var badgeText = '♾️ Fijo';
        
        var hasVariants = p.variantes && p.variantes.length > 0;
        
        if (p.activo === false) {
          badgeClass = 'inactive';
          badgeText = '🚫 Inactivo';
        } else if (p.disponible === false) {
          badgeClass = 'inactive';
          badgeText = '🚫 Oculto';
        } else if (hasVariants) {
          if (descStock) {
            var totalStock = p.variantes.reduce(function(acc, v) { return acc + parseInt(v.stock || 0); }, 0);
            var hasLowStockVariant = p.variantes.some(function(v) { 
              var min = v.stockMinimo !== undefined ? v.stockMinimo : 5;
              return parseInt(v.stock || 0) <= min; 
            });
            
            if (totalStock <= 0) {
              badgeClass = 'empty';
              badgeText = '🔴 Agotado (' + p.variantes.length + ' var)';
            } else if (hasLowStockVariant) {
              badgeClass = 'low';
              badgeText = '⚠️ Stock: ' + totalStock + ' (' + p.variantes.length + ' var)';
            } else {
              badgeClass = 'ok';
              badgeText = '📦 Stock: ' + totalStock + ' (' + p.variantes.length + ' var)';
            }
          } else {
            badgeClass = 'unlimited';
            badgeText = '♾️ Fijo (' + p.variantes.length + ' var)';
          }
        } else if (descStock) {
          var minLimit = p.stockMinimo !== undefined ? parseFloat(p.stockMinimo) : 5;
          if (stock <= 0) {
            badgeClass = 'empty';
            badgeText = '🔴 Agotado';
          } else if (stock <= minLimit) {
            badgeClass = 'low';
            badgeText = '⚠️ Stock: ' + stock;
          } else {
            badgeClass = 'ok';
            badgeText = '📦 Stock: ' + stock;
          }
        }

        var priceText = '';
        if (hasVariants) {
          var prices = p.variantes.map(function(v) { return parseFloat(v.p || v.precio || 0); });
          var minPrice = Math.min.apply(null, prices);
          var maxPrice = Math.max.apply(null, prices);
          if (minPrice === maxPrice) {
            priceText = '$' + minPrice.toFixed(2);
          } else {
            priceText = '$' + minPrice.toFixed(2) + ' - $' + maxPrice.toFixed(2);
          }
        } else {
          priceText = '$' + parseFloat(p.precio || p.precio_venta || 0).toFixed(2);
        }
        
        var emoji = p.emoji || p.icono || '🍽️';

        return '<div class="prod-card" onclick="openEditModal(\'' + p._id + '\')">'
          + '<div class="card-top">'
            + '<div class="card-emoji">' + emoji + '</div>'
            + '<div class="stock-badge ' + badgeClass + '">' + badgeText + '</div>'
          + '</div>'
          + '<div class="card-info">'
            + '<div class="card-name">' + p.nombre + '</div>'
          + '</div>'
          + '<div class="card-bottom">'
            + '<div class="card-price">' + priceText + '</div>'
            + '<div class="card-cat-tag">' + p._cat + '</div>'
          + '</div>'
          + '</div>';
      }).join('');
    }

    function filtrarProductos() {
      renderProductGrid();
    }

    function populateCategorySelect() {
      var select = document.getElementById('p-cat-select');
      var cats = Array.from(_categories).filter(function(c) { return c !== 'Todos'; });
      
      var options = cats.map(function(c) {
        return '<option value="' + c + '">' + c + '</option>';
      }).join('');
      
      select.innerHTML = options;
    }

    function toggleStockField(isChecked) {
      var stockField = document.getElementById('p-stock');
      if (isChecked) {
        stockField.disabled = false;
        stockField.style.opacity = '1';
      } else {
        stockField.disabled = true;
        stockField.style.opacity = '0.4';
      }
    }

    function toggleCustomCategory() {
      var select = document.getElementById('p-cat-select');
      var customInput = document.getElementById('p-cat-custom');
      var btn = document.getElementById('btn-toggle-cat');
      
      if (_isCustomCategoryMode) {
        select.style.display = 'block';
        customInput.style.display = 'none';
        btn.innerHTML = '<i class="fa-solid fa-plus"></i>';
        btn.title = "Nueva categoría";
        _isCustomCategoryMode = false;
      } else {
        select.style.display = 'none';
        customInput.style.display = 'block';
        customInput.focus();
        btn.innerHTML = '<i class="fa-solid fa-list"></i>';
        btn.title = "Categorías existentes";
        _isCustomCategoryMode = true;
      }
    }

    function syncCategoryInput(val) {
      document.getElementById('p-cat-custom').value = val;
    }

    var _currentProductVariantes = [];

    function renderInventarioVariantes() {
      var container = document.getElementById('i-var-list');
      if (!_currentProductVariantes || _currentProductVariantes.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 12px; color: var(--text-sub); font-size: 13px; border: 1px dashed var(--border); border-radius: var(--radius-md);">Sin variaciones registradas.</div>';
        return;
      }
      
      container.innerHTML = _currentProductVariantes.map(function(v, i) {
        var vName = v.n || v.nombre || '';
        var vPrice = parseFloat(v.p || v.precio || 0);
        var vStock = parseInt(v.stock || 0);
        var vMin = parseInt(v.stockMinimo !== undefined ? v.stockMinimo : 5);
        
        return '<div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">'
          + '<input type="text" class="form-control" style="flex: 2; min-width: 80px;" placeholder="Ej. Salutaris" value="' + vName + '" oninput="updateInventarioVariante(' + i + ', \'n\', this.value)">'
          + '<input type="number" class="form-control" style="flex: 1.2; min-width: 60px;" placeholder="Prec. ($)" step="0.01" min="0" value="' + vPrice + '" oninput="updateInventarioVariante(' + i + ', \'p\', parseFloat(this.value)||0)">'
          + '<input type="number" class="form-control" style="flex: 1.2; min-width: 60px;" placeholder="Stock" min="0" value="' + vStock + '" oninput="updateInventarioVariante(' + i + ', \'stock\', parseInt(this.value)||0)">'
          + '<input type="number" class="form-control" style="flex: 1.2; min-width: 60px;" placeholder="Mínimo" min="0" value="' + vMin + '" oninput="updateInventarioVariante(' + i + ', \'stockMinimo\', parseInt(this.value)||5)">'
          + '<button class="btn-danger" style="padding: 10px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;" onclick="removeInventarioVariante(' + i + ', event)"><i class="fa-solid fa-trash"></i></button>'
          + '</div>';
      }).join('');
    }

    function addInventarioVariante(e) {
      if(e) e.preventDefault();
      _currentProductVariantes.push({ n: '', p: 0, stock: 0, stockMinimo: 5 });
      renderInventarioVariantes();
    }

    function updateInventarioVariante(index, field, val) {
      if (_currentProductVariantes[index]) {
        _currentProductVariantes[index][field] = val;
        if (field === 'n') _currentProductVariantes[index]['nombre'] = val;
        if (field === 'nombre') _currentProductVariantes[index]['n'] = val;
        if (field === 'p') _currentProductVariantes[index]['precio'] = val;
        if (field === 'precio') _currentProductVariantes[index]['p'] = val;
      }
    }

    function removeInventarioVariante(index, e) {
      if(e) e.preventDefault();
      _currentProductVariantes.splice(index, 1);
      renderInventarioVariantes();
    }

    function openCreateModal() {
      _currentEditingId = null;
      _currentEditingOriginalCat = null;
      _isCustomCategoryMode = false;

      document.getElementById('modal-title').textContent = "Nuevo Producto";
      document.getElementById('p-name').value = '';
      document.getElementById('p-price').value = '';
      document.getElementById('p-emoji').value = '🍽️';
      document.getElementById('p-desc-stock').checked = false;
      document.getElementById('p-stock').value = '0';
      document.getElementById('p-stock-minimo').value = '5';
      document.getElementById('p-disponible').checked = true;
      document.getElementById('p-activo').checked = true;
      document.getElementById('p-desc').value = '';
      
      var select = document.getElementById('p-cat-select');
      select.style.display = 'block';
      document.getElementById('p-cat-custom').style.display = 'none';
      document.getElementById('btn-toggle-cat').innerHTML = '<i class="fa-solid fa-plus"></i>';
      
      if (select.options.length > 0) {
        select.selectedIndex = 0;
        document.getElementById('p-cat-custom').value = select.value;
      } else {
        toggleCustomCategory();
        document.getElementById('p-cat-custom').value = '';
      }

      toggleStockField(false);
      _currentProductVariantes = [];
      renderInventarioVariantes();
      
      document.getElementById('btn-delete-product').style.display = 'none';
      document.getElementById('product-modal').classList.add('open');
    }

    function openEditModal(id) {
      var p = _prods[id];
      if (!p) return;

      _currentEditingId = id;
      _currentEditingOriginalCat = p._cat;
      _isCustomCategoryMode = false;

      document.getElementById('modal-title').textContent = "Editar Producto";
      document.getElementById('p-name').value = p.nombre || '';
      document.getElementById('p-price').value = p.precio || p.precio_venta || '';
      document.getElementById('p-emoji').value = p.emoji || p.icono || '🍽️';
      
      var descStock = !!p.descuenta;
      document.getElementById('p-desc-stock').checked = descStock;
      document.getElementById('p-stock').value = p.stockFijo || '0';
      document.getElementById('p-stock-minimo').value = p.stockMinimo !== undefined ? p.stockMinimo : '5';
      toggleStockField(descStock);

      document.getElementById('p-disponible').checked = p.disponible !== false;
      document.getElementById('p-activo').checked = p.activo !== false;
      document.getElementById('p-desc').value = p.descripcion || '';

      var select = document.getElementById('p-cat-select');
      select.style.display = 'block';
      document.getElementById('p-cat-custom').style.display = 'none';
      document.getElementById('btn-toggle-cat').innerHTML = '<i class="fa-solid fa-plus"></i>';
      
      select.value = p._cat;
      document.getElementById('p-cat-custom').value = p._cat;

      _currentProductVariantes = p.variantes ? JSON.parse(JSON.stringify(p.variantes)) : [];
      renderInventarioVariantes();

      document.getElementById('btn-delete-product').style.display = 'block';
      document.getElementById('product-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('product-modal').classList.remove('open');
    }

    function guardarProducto() {
      var name = document.getElementById('p-name').value.trim();
      var category = document.getElementById('p-cat-custom').value.trim();
      var priceVal = parseFloat(document.getElementById('p-price').value);
      var emoji = document.getElementById('p-emoji').value.trim();
      var descStock = document.getElementById('p-desc-stock').checked;
      var stockVal = parseInt(document.getElementById('p-stock').value) || 0;
      var stockMinimoVal = parseInt(document.getElementById('p-stock-minimo').value) || 5;
      var disponible = document.getElementById('p-disponible').checked;
      var activo = document.getElementById('p-activo').checked;
      var desc = document.getElementById('p-desc').value.trim();

      if (!name) { showToast("⚠ El nombre es requerido", "warn"); return; }
      if (!category) { showToast("⚠ La categoría es requerida", "warn"); return; }
      if (isNaN(priceVal) || priceVal < 0) { showToast("⚠ Precio inválido", "warn"); return; }

      category = category.toUpperCase().trim();

      var normalizedVariants = _currentProductVariantes.map(function(v) {
        var nameVal = v.n || v.nombre || '';
        var priceVal = parseFloat(v.p || v.precio || 0);
        var stockVal = parseInt(v.stock || 0);
        var minVal = parseInt(v.stockMinimo !== undefined ? v.stockMinimo : 5);
        return {
          n: nameVal,
          nombre: nameVal,
          p: priceVal,
          precio: priceVal,
          stock: stockVal,
          stockMinimo: minVal
        };
      });

      var originalProd = _currentEditingId ? (_prods[_currentEditingId] || {}) : {};

      var data = {
        nombre: name,
        precio: priceVal,
        precio_venta: priceVal,
        emoji: emoji,
        icono: emoji,
        descuenta: descStock,
        stockFijo: stockVal,
        stockMinimo: stockMinimoVal,
        disponible: disponible,
        activo: activo,
        descripcion: desc,
        variantes: normalizedVariants,
        ts: Date.now()
      };

      if (originalProd.ingredientes) data.ingredientes = originalProd.ingredientes;
      if (originalProd.extras) data.extras = originalProd.extras;
      if (originalProd.img) data.img = originalProd.img;

      // Update local prev stock state to prevent self-notification
      if (_currentEditingId) {
        if (descStock) {
          if (normalizedVariants.length > 0) {
            normalizedVariants.forEach(function(v, idx) {
              _prevStockState[_currentEditingId + '_' + idx] = v.stock;
            });
          } else {
            _prevStockState[_currentEditingId] = stockVal;
          }
        }
      }

      if (_currentEditingId) {
        var refId = _currentEditingId;
        var oldCat = _currentEditingOriginalCat;

        if (oldCat !== category) {
          db.ref('negocios/' + negocioID + '/productos/' + oldCat + '/' + refId).remove().then(function() {
            db.ref('negocios/' + negocioID + '/productos/' + category + '/' + refId).set(data).then(function() {
              showToast("✅ Producto actualizado y movido de categoría", "ok");
              closeModal();
            });
          }).catch(function(err) {
            showToast("❌ Error al mover producto: " + err.message, "err");
          });
        } else {
          db.ref('negocios/' + negocioID + '/productos/' + category + '/' + refId).update(data).then(function() {
            showToast("✅ Producto actualizado con éxito", "ok");
            closeModal();
          }).catch(function(err) {
            showToast("❌ Error: " + err.message, "err");
          });
        }
      } else {
        db.ref('negocios/' + negocioID + '/productos/' + category).push(data).then(function() {
          showToast("✅ Producto creado con éxito", "ok");
          closeModal();
        }).catch(function(err) {
          showToast("❌ Error al crear producto: " + err.message, "err");
        });
      }
    }

    function eliminarProducto() {
      if (!_currentEditingId || !_currentEditingOriginalCat) return;
      if (!confirm("🚨 ¿Está seguro de eliminar este producto por completo del menú?")) return;

      var refId = _currentEditingId;
      var cat = _currentEditingOriginalCat;

      db.ref('negocios/' + negocioID + '/productos/' + cat + '/' + refId).remove().then(function() {
        showToast("🗑️ Producto eliminado con éxito", "ok");
        closeModal();
      }).catch(function(err) {
        showToast("❌ Error al eliminar: " + err.message, "err");
      });
    }

    function logout() {
      if (confirm("¿Cerrar sesión en control de inventario?")) {
        localStorage.removeItem('empleado_activo');
        localStorage.removeItem('food_session_' + negocioID);
        window.location.href = 'login.html';
      }
    }

    var _toastTimeout = null;
    function showToast(msg, type) {
      var t = document.getElementById('toast-notif');
      var txt = document.getElementById('toast-text');
      var icon = document.getElementById('toast-icon');

      txt.textContent = msg;
      t.className = "toast show " + (type || "ok");
      
      if (type === "ok") icon.textContent = "✅";
      else if (type === "warn") icon.textContent = "⚠️";
      else if (type === "err") icon.textContent = "❌";
      else icon.textContent = "ℹ️";

      if (_toastTimeout) clearTimeout(_toastTimeout);
      _toastTimeout = setTimeout(function() {
        t.classList.remove('show');
      }, 3000);
    }
  </script>
</body>
</html>
